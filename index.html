<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>freq. — tune into how you feel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&family=Syne:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05040a;
      --deep: #08061a;
      --orb1: #7c3aed;
      --orb2: #4f46e5;
      --orb3: #0ea5e9;
      --muted: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.82);
      --dim: rgba(255,255,255,0.35);
      --glow: rgba(124,58,237,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      cursor: none;
    }

    /* ── CUSTOM CURSOR ── */
    #cursor {
      position: fixed; width: 10px; height: 10px;
      background: rgba(124,58,237,0.9);
      border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      transition: transform 0.08s ease, width 0.2s, height 0.2s, background 0.3s;
      mix-blend-mode: screen;
    }
    #cursor-ring {
      position: fixed; width: 36px; height: 36px;
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: transform 0.18s ease, width 0.3s, height 0.3s, border-color 0.3s;
    }

    /* ── CANVAS ── */
    #bg-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
      opacity: 0; pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── LANDING ── */
    #s-land .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 14vw, 11rem);
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 0.9;
      background: linear-gradient(135deg, #e8d5ff 0%, #a78bfa 40%, #818cf8 70%, #7dd3fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 60px rgba(124,58,237,0.6));
      animation: brandPulse 4s ease-in-out infinite;
      position: relative;
    }
    @keyframes brandPulse {
      0%,100% { filter: drop-shadow(0 0 60px rgba(124,58,237,0.6)); }
      50% { filter: drop-shadow(0 0 100px rgba(124,58,237,0.9)) drop-shadow(0 0 200px rgba(79,70,229,0.4)); }
    }
    #s-land .tagline {
      margin-top: 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.6rem, 1.5vw, 0.85rem);
      letter-spacing: 0.25em;
      color: var(--dim);
      text-transform: uppercase;
      animation: fadeUp 1.2s 0.6s both;
    }
    #s-land .start-btn {
      margin-top: 4rem;
      background: none; border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      cursor: none;
      transition: color 0.4s, letter-spacing 0.4s;
      animation: fadeUp 1.4s 1.2s both;
      position: relative;
    }
    #s-land .start-btn::after {
      content: '';
      position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,0.8), transparent);
      transition: width 0.4s;
    }
    #s-land .start-btn:hover { color: rgba(255,255,255,0.7); letter-spacing: 0.5em; }
    #s-land .start-btn:hover::after { width: 100%; }

    /* ── ORBS ── */
    .orb-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 1;
    }
    .orb {
      width: min(55vw, 520px); height: min(55vw, 520px);
      border-radius: 50%;
      position: relative;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-inner {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 35%,
        rgba(167,139,250,0.35) 0%,
        rgba(99,102,241,0.25) 30%,
        rgba(14,165,233,0.12) 60%,
        transparent 75%
      );
      filter: blur(30px);
      animation: orbInner 6s ease-in-out infinite alternate;
    }
    .orb-ring {
      position: absolute; inset: -20px;
      border-radius: 50%;
      border: 1px solid rgba(124,58,237,0.15);
      animation: ringRotate 20s linear infinite;
    }
    .orb-ring-2 {
      position: absolute; inset: -50px;
      border-radius: 50%;
      border: 1px solid rgba(79,70,229,0.08);
      animation: ringRotate 35s linear infinite reverse;
    }
    .orb-dot {
      position: absolute; width: 5px; height: 5px;
      background: rgba(167,139,250,0.8);
      border-radius: 50%;
      top: -22px; left: 50%;
      box-shadow: 0 0 10px rgba(167,139,250,0.8);
    }
    @keyframes orbFloat {
      0%,100% { transform: translateY(0) scale(1); }
      33% { transform: translateY(-18px) scale(1.02); }
      66% { transform: translateY(10px) scale(0.98); }
    }
    @keyframes orbInner {
      from { transform: scale(1) rotate(0deg); opacity: 0.8; }
      to { transform: scale(1.1) rotate(15deg); opacity: 1; }
    }
    @keyframes ringRotate { to { transform: rotate(360deg); } }

    /* ── INPUT SCREEN ── */
    #s-input .glass-box {
      width: min(90vw, 580px);
      padding: 3rem;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(124,58,237,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
      animation: glassReveal 0.6s ease both;
    }
    @keyframes glassReveal {
      from { transform: translateY(20px) scale(0.97); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    #s-input .glass-box::before {
      content: '';
      position: absolute; inset: -1px;
      border-radius: 25px;
      background: linear-gradient(135deg, rgba(124,58,237,0.2), transparent, rgba(14,165,233,0.1));
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #s-input .glass-box:focus-within::before { opacity: 1; }

    #s-input .input-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: block;
    }
    #s-input textarea {
      width: 100%; background: none; border: none; outline: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.8);
      resize: none; min-height: 100px;
      line-height: 1.7;
      caret-color: rgba(124,58,237,0.9);
    }
    #s-input textarea::placeholder { color: rgba(255,255,255,0.18); }
    #s-input .char-hint {
      margin-top: 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.15);
    }
    #s-input .submit-btn {
      margin-top: 2rem;
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(79,70,229,0.2));
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      cursor: none;
      transition: all 0.3s;
      position: relative; overflow: hidden;
    }
    #s-input .submit-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(79,70,229,0.4));
      opacity: 0; transition: opacity 0.3s;
    }
    #s-input .submit-btn:hover { color: rgba(255,255,255,0.9); border-color: rgba(124,58,237,0.6); }
    #s-input .submit-btn:hover::before { opacity: 1; }
    #s-input .submit-btn span { position: relative; z-index: 1; }

    /* ── PROCESSING ── */
    #s-proc .proc-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 300;
      font-style: italic;
      color: var(--dim);
      letter-spacing: 0.05em;
      animation: procPulse 2s ease-in-out infinite;
    }
    @keyframes procPulse {
      0%,100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    .wave-rings {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .wave-ring {
      position: absolute;
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 50%;
      animation: waveExpand 3s ease-out infinite;
    }
    .wave-ring:nth-child(1) { animation-delay: 0s; }
    .wave-ring:nth-child(2) { animation-delay: 0.8s; }
    .wave-ring:nth-child(3) { animation-delay: 1.6s; }
    @keyframes waveExpand {
      0% { width: 80px; height: 80px; opacity: 0.8; }
      100% { width: 600px; height: 600px; opacity: 0; }
    }

    /* ── RESULT ── */
    #s-result {
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      padding: 2rem;
    }
    .result-card {
      width: min(90vw, 500px);
      padding: 2.5rem;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      box-shadow: 0 0 80px rgba(124,58,237,0.15);
      animation: cardReveal 0.8s cubic-bezier(0.16,1,0.3,1) both;
      position: relative; overflow: hidden;
    }
    @keyframes cardReveal {
      from { transform: translateY(30px) scale(0.95); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .result-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,0.5), transparent);
    }
    .emotion-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1.8rem;
    }
    .album-art {
      width: 100%; aspect-ratio: 1;
      border-radius: 16px;
      position: relative; overflow: hidden;
      margin-bottom: 1.8rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .album-art-inner {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .album-gradient {
      position: absolute; inset: 0;
      border-radius: 16px;
    }
    .album-symbol {
      font-size: 4rem;
      position: relative; z-index: 1;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
      animation: symbolFloat 4s ease-in-out infinite;
    }
    @keyframes symbolFloat {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }
    .album-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%,100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }
    .song-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 400;
      line-height: 1.2;
      color: rgba(255,255,255,0.9);
      margin-bottom: 0.4rem;
    }
    .song-artist {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .ai-line {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      padding: 1.2rem;
      border-left: 1px solid rgba(124,58,237,0.3);
      background: rgba(124,58,237,0.05);
      border-radius: 0 8px 8px 0;
      margin-bottom: 2rem;
    }
    .result-actions {
      display: flex; flex-direction: column; gap: 0.8rem;
    }
    .btn-listen {
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(79,70,229,0.4));
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
      cursor: none;
      transition: all 0.3s;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-listen:hover { background: linear-gradient(135deg, rgba(124,58,237,0.7), rgba(79,70,229,0.6)); color: white; }
    .btn-row { display: flex; gap: 0.8rem; }
    .btn-secondary {
      flex: 1; padding: 0.85rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      text-transform: uppercase;
      cursor: none;
      transition: all 0.3s;
      text-align: center;
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }

    /* ── HISTORY ── */
    #s-history {
      flex-direction: column;
      overflow-y: auto;
      padding: 3rem 2rem;
      align-items: center;
      gap: 1rem;
    }
    #s-history .hist-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 300;
      font-style: italic;
      background: linear-gradient(135deg, #e8d5ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    #s-history .hist-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .hist-list { width: min(90vw, 500px); display: flex; flex-direction: column; gap: 0.8rem; }
    .hist-item {
      padding: 1.2rem 1.5rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      display: flex; align-items: center; gap: 1rem;
      cursor: none;
      transition: all 0.3s;
      animation: fadeUp 0.5s ease both;
    }
    .hist-item:hover { background: rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.2); }
    .hist-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .hist-content { flex: 1; min-width: 0; }
    .hist-mood {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem; font-style: italic;
      color: rgba(255,255,255,0.6);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hist-song {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.1em;
      color: var(--dim); text-transform: uppercase;
      margin-top: 0.2rem;
    }
    .hist-time { font-family: 'DM Mono', monospace; font-size: 0.55rem; color: rgba(255,255,255,0.15); flex-shrink: 0; }
    .hist-empty {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-style: italic;
      color: rgba(255,255,255,0.2);
      text-align: center; padding: 3rem;
    }

    /* ── NAV ── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 2.5rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s;
    }
    #nav.visible { opacity: 1; pointer-events: all; }
    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 300;
      background: linear-gradient(135deg, #e8d5ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link {
      background: none; border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.2em;
      color: var(--dim); text-transform: uppercase;
      cursor: none; transition: color 0.3s;
    }
    .nav-link:hover, .nav-link.active { color: rgba(255,255,255,0.7); }

    /* ── SCANLINES ── */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 9990;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
    }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(124,58,237,0.2);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 100px;
      padding: 0.7rem 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.15em;
      color: rgba(255,255,255,0.7); text-transform: uppercase;
      z-index: 200; opacity: 0;
      transition: all 0.4s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── UTILS ── */
    @keyframes fadeUp {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 2px; }

    /* ── MOOD VIBES floating words ── */
    .floater {
      position: fixed;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: rgba(255,255,255,0.04);
      font-size: 1rem;
      pointer-events: none;
      z-index: 2;
      animation: floatDrift linear infinite;
    }
    @keyframes floatDrift {
      0% { transform: translateY(100vh) rotate(-5deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(5deg); opacity: 0; }
    }

    /* ── WAVEFORM BAR ── */
    .waveform {
      display: flex; align-items: center; gap: 3px;
      height: 30px;
      margin: 1rem 0;
    }
    .wave-bar {
      width: 3px; border-radius: 2px;
      background: linear-gradient(to top, rgba(124,58,237,0.6), rgba(167,139,250,0.3));
      animation: barDance 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }
    .wave-bar:nth-child(6) { animation-delay: 0.5s; }
    .wave-bar:nth-child(7) { animation-delay: 0.6s; }
    .wave-bar:nth-child(8) { animation-delay: 0.7s; }
    @keyframes barDance {
      0%,100% { height: 4px; }
      50% { height: 24px; }
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 9989;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<canvas id="bg-canvas"></canvas>

<!-- NAV -->
<nav id="nav">
  <div class="nav-brand">freq.</div>
  <div class="nav-links">
    <button class="nav-link" id="nav-home">home</button>
    <button class="nav-link" id="nav-history">frequencies you've been</button>
  </div>
</nav>

<!-- LANDING -->
<section class="screen active" id="s-land">
  <div class="orb-wrap">
    <div class="orb" id="main-orb">
      <div class="orb-ring"><div class="orb-dot"></div></div>
      <div class="orb-ring-2"></div>
      <div class="orb-inner"></div>
    </div>
  </div>
  <div style="position:relative;z-index:5;text-align:center;">
    <h1 class="brand">freq.</h1>
    <p class="tagline">tune into how you feel</p>
    <button class="start-btn" id="btn-start">— start —</button>
  </div>
</section>

<!-- INPUT -->
<section class="screen" id="s-input">
  <div class="glass-box">
    <span class="input-label">release something</span>
    <textarea id="mood-input" placeholder="what's sitting in your chest?" rows="4" maxlength="280"></textarea>
    <div class="char-hint">some feelings don't need explanation</div>
    <button class="submit-btn" id="btn-submit"><span>tune my frequency →</span></button>
  </div>
</section>

<!-- PROCESSING -->
<section class="screen" id="s-proc">
  <div class="wave-rings">
    <div class="wave-ring"></div>
    <div class="wave-ring"></div>
    <div class="wave-ring"></div>
  </div>
  <div style="position:relative;z-index:5;text-align:center;">
    <div class="waveform" style="justify-content:center;margin-bottom:2rem;">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <p class="proc-text">tuning your frequency…</p>
  </div>
</section>

<!-- RESULT -->
<section class="screen" id="s-result">
  <div class="result-card" id="result-card">
    <div class="emotion-tag" id="result-emotion"></div>
    <div class="album-art">
      <div class="album-art-inner">
        <div class="album-gradient" id="album-gradient"></div>
        <div class="album-symbol" id="album-symbol"></div>
        <div class="album-shimmer"></div>
      </div>
    </div>
    <div class="song-title" id="result-song"></div>
    <div class="song-artist" id="result-artist"></div>
    <div class="ai-line" id="result-line"></div>
    <div class="result-actions">
      <a class="btn-listen" id="btn-listen" href="#" target="_blank">♫ listen now</a>
      <div class="btn-row">
        <button class="btn-secondary" id="btn-save">save this ✦</button>
        <button class="btn-secondary" id="btn-again">not this →</button>
      </div>
    </div>
  </div>
</section>

<!-- HISTORY -->

  <h2 class="hist-title">frequencies you've been</h2>
  <p class="hist-sub">a quiet archive of you</p>
  <div class="hist-list" id="hist-list"></div>
  <button class="btn-secondary" id="btn-hist-back" style="margin-top:1.5rem;padding:0.8rem 2rem;width:min(90vw,500px);">← return</button>
</section>

const EMOTION_MAP = {
  sad:["sad","cry","crying","tears","hurt","broken","pain","lost","grief","heartbreak","devastated","depressed","empty","hollow","shattered","miss","missed","missing","grief"],
  lonely:["alone","lonely","loneliness","isolated","disconnected","solitude","no one","nobody","abandoned","left","ghost"],
  calm:["calm","peace","quiet","still","okay","gentle","soft","light","breathe","breathing","relaxed","serene","tranquil"],
  nostalgic:["remember","memory","memories","past","old","before","used to","childhood","miss","nostalgia","throwback","wish things were"],
  anxious:["anxious","anxiety","worried","worry","stress","stressed","nervous","panic","scared","fear","overthink","can't stop thinking"],
  numb:["numb","empty","nothing","blank","hollow","disconnected","can't feel","don't feel","detached","flat","bored","dull","lifeless"],
  hopeful:["hope","hopeful","better","soon","will be","looking forward","excited","can't wait","new","fresh","start","ready"],
  love:["love","crush","like","adore","him","her","them","someone","butterflies","heart","feeling for","feelings for","in love"],
  miss:["miss","missing","gone","left","away","far","lost you","without you","wish you were","your absence","separated"],
  tired:["tired","exhausted","drained","burnt out","burnout","worn out","sleepy","rest","no energy","fatigue","done"],
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentScreen = 's-land';
let history = JSON.parse(localStorage.getItem('freq_history') || '[]');
let currentResult = null;
let mouseX = 0, mouseY = 0;
let cursorX = 0, cursorY = 0;
let ringX = 0, ringY = 0;

// ─────────────────────────────────────────────
// CURSOR
// ─────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

function animateCursor() {
  cursorX += (mouseX - cursorX) * 0.35;
  cursorY += (mouseY - cursorY) * 0.35;
  ringX += (mouseX - ringX) * 0.1;
  ringY += (mouseY - ringY) * 0.1;
  cursor.style.left = cursorX + 'px';
  cursor.style.top = cursorY + 'px';
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top = ringY + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();

document.querySelectorAll('button, a, textarea').forEach(el => {
  el.addEventListener('mouseenter', () => {
    cursor.style.width = '18px'; cursor.style.height = '18px';
    cursorRing.style.width = '56px'; cursorRing.style.height = '56px';
    cursorRing.style.borderColor = 'rgba(167,139,250,0.6)';
  });
  el.addEventListener('mouseleave', () => {
    cursor.style.width = '10px'; cursor.style.height = '10px';
    cursorRing.style.width = '36px'; cursorRing.style.height = '36px';
    cursorRing.style.borderColor = 'rgba(124,58,237,0.4)';
  });
});

// ─────────────────────────────────────────────
// CANVAS — PARTICLE FIELD
// ─────────────────────────────────────────────
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

class Particle {
  constructor() { this.reset(); this.y = Math.random() * H; }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 10;
    this.size = Math.random() * 2 + 0.3;
    this.speedY = Math.random() * 0.4 + 0.1;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.hue = Math.random() > 0.5 ? 260 + Math.random() * 40 : 200 + Math.random() * 30;
  }
  update() {
    this.y -= this.speedY;
    this.x += this.speedX;
    if (this.y < -5) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 75%, ${this.opacity})`;
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < 120; i++) particles.push(new Particle());
}

let bgHue1 = 260, bgHue2 = 230;
function animCanvas() {
  ctx.clearRect(0, 0, W, H);
  // Subtle aurora bg
  const grad = ctx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.4, W*0.7);
  grad.addColorStop(0, `hsla(${bgHue1}, 60%, 8%, 0.6)`);
  grad.addColorStop(0.5, `hsla(${bgHue2}, 50%, 5%, 0.4)`);
  grad.addColorStop(1, 'hsla(240, 30%, 3%, 0.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Draw grid lines (subtle)
  ctx.strokeStyle = 'rgba(124,58,237,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animCanvas);
}

resize();
initParticles();
animCanvas();
window.addEventListener('resize', () => { resize(); initParticles(); });

// ─────────────────────────────────────────────
// ORB MOUSE REACTION
// ─────────────────────────────────────────────
const orb = document.getElementById('main-orb');
document.addEventListener('mousemove', e => {
  if (currentScreen !== 's-land') return;
  const dx = (e.clientX / W - 0.5) * 20;
  const dy = (e.clientY / H - 0.5) * 20;
  orb.style.transform = `translate(${dx}px, ${dy}px)`;
});

// ─────────────────────────────────────────────
const words = ["feel","ache","quiet","drift","breathe","stay","softly","idk","missing","somewhere","numb","awake","slowly","tonight","reset","inner","dim","safe"];
function spawnFloater() {
  const el = document.createElement('div');
  el.className = 'floater';
  el.textContent = words[Math.floor(Math.random() * words.length)];
  el.style.left = Math.random() * 90 + 'vw';

  el.style.animationDuration = (18 + Math.random() * 20) + 's';
  el.style.animationDelay = (Math.random() * 5) + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 40000);
}
setInterval(spawnFloater, 3000);
for (let i = 0; i < 6; i++) setTimeout(spawnFloater, i * 500);

// ─────────────────────────────────────────────
// SCREEN TRANSITIONS
// ─────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
  currentScreen = id;
  const nav = document.getElementById('nav');
  nav.classList.toggle('visible', id !== 's-land');
}

// ─────────────────────────────────────────────
// EMOTION DETECTION
// ─────────────────────────────────────────────
function detectEmotion(text) {
  const lower = text.toLowerCase();
  let scores = {};
  Object.entries(EMOTION_MAP).forEach(([emotion, keywords]) => {
    scores[emotion] = keywords.filter(k => lower.includes(k)).length;
  });
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  if (top[0][1] === 0) {
    const fallbacks = Object.keys(SONGS);
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
  }
  return top[0][0];
}

function getSong(emotion) {
  const pool = SONGS[emotion] || SONGS.calm;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ─────────────────────────────────────────────
// RESULT DISPLAY
// ─────────────────────────────────────────────
const EMOTION_LABELS = {
  sad:"something heavy", lonely:"solitude", calm:"stillness",
  nostalgic:"looking back", anxious:"the noise inside", numb:"flat space",
  hopeful:"something lifting", love:"a feeling for someone", miss:"absence",
  tired:"deep exhaustion"
};

function showResult(emotion, song, inputText) {
  document.getElementById('result-emotion').textContent = `✦ ${EMOTION_LABELS[emotion] || emotion}`;
  document.getElementById('result-song').textContent = song.title;
  document.getElementById('result-artist').textContent = song.artist;
  document.getElementById('result-line').textContent = `"${song.line}"`;
  document.getElementById('album-symbol').textContent = song.symbol;
  document.getElementById('album-gradient').style.background =
    `radial-gradient(ellipse at 40% 40%, ${song.colors[0]}, ${song.colors[1]}, ${song.colors[2]})`;

  const searchQ = encodeURIComponent(song.search);
  document.getElementById('btn-listen').href = `https://www.youtube.com/results?search_query=${searchQ}`;

  // Update bg color theme
  bgHue1 = parseInt(song.colors[1].match(/[0-9a-f]{6}/i)?.[0] ? '260' : '260');

  currentResult = { emotion, song, inputText, time: Date.now() };
  showScreen('s-result');
}

// ─────────────────────────────────────────────
// PROCESS FLOW
// ─────────────────────────────────────────────
function process(text) {
  showScreen('s-proc');
  setTimeout(() => {
    const emotion = detectEmotion(text);
    const song = getSong(emotion);
    showResult(emotion, song, text);
  }, 2800);
}

// ─────────────────────────────────────────────
// HISTORY
// ─────────────────────────────────────────────
const HIST_COLORS = ['#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899'];

function saveFrequency() {
  if (!currentResult) return;
  const entry = {
    id: Date.now(),
    input: currentResult.inputText,
    emotion: currentResult.emotion,
    song: currentResult.song.title,
    artist: currentResult.song.artist,
    time: currentResult.time,
    color: HIST_COLORS[Math.floor(Math.random() * HIST_COLORS.length)]
  };
  history.unshift(entry);
  if (history.length > 30) history = history.slice(0, 30);
  localStorage.setItem('freq_history', JSON.stringify(history));
  showToast('frequency saved ✦');
}

function renderHistory() {
  const list = document.getElementById('hist-list');
  if (history.length === 0) {
    list.innerHTML = '<div class="hist-empty">no frequencies yet…<br>go feel something</div>';
    return;
  }
  list.innerHTML = history.map((e, i) => {
    const date = new Date(e.time);
    const label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `<div class="hist-item" style="animation-delay:${i*0.07}s">
      <div class="hist-dot" style="background:${e.color};box-shadow:0 0 8px ${e.color}"></div>
      <div class="hist-content">
        <div class="hist-mood">${e.input}</div>
        <div class="hist-song">♪ ${e.song} — ${e.artist}</div>
      </div>
      <div class="hist-time">${label}</div>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => showScreen('s-input'));

document.getElementById('btn-submit').addEventListener('click', () => {
  const val = document.getElementById('mood-input').value.trim();
  if (!val) { showToast('say something — anything'); return; }
  process(val);
});

document.getElementById('mood-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btn-submit').click();
  }
});

document.getElementById('btn-save').addEventListener('click', saveFrequency);

document.getElementById('btn-again').addEventListener('click', () => {
  if (!currentResult) return;
  const emotion = currentResult.emotion;
  const pool = SONGS[emotion];
  const newSong = pool[Math.floor(Math.random() * pool.length)];
  showResult(emotion, newSong, currentResult.inputText);
});

document.getElementById('nav-home').addEventListener('click', () => showScreen('s-input'));
document.getElementById('nav-history').addEventListener('click', () => {
  renderHistory();
  showScreen('s-history');
});
document.getElementById('btn-hist-back').addEventListener('click', () => showScreen('s-input'));

// Textarea glow effect
const ta = document.getElementById('mood-input');
ta.addEventListener('input', () => {
  const parent = ta.closest('.glass-box');
  parent.style.boxShadow = ta.value.length > 5
    ? '0 0 80px rgba(124,58,237,0.2), inset 0 1px 0 rgba(255,255,255,0.06)'
    : '';
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && currentScreen !== 's-land') {
    showScreen('s-input');
  }
});
</script>
