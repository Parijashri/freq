<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>freq. — tune into how you feel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #04030c;
  --deep: #07051a;
  --orb1: #6d28d9;
  --orb2: #4338ca;
  --orb3: #0891b2;
  --muted: rgba(255,255,255,0.07);
  --text: rgba(255,255,255,0.84);
  --dim: rgba(255,255,255,0.32);
  --glow: rgba(109,40,217,0.5);
  --heart: rgba(196,167,255,0.9);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Playfair Display',serif;overflow:hidden;cursor:none;}

/* ── CUSTOM CURSOR ── */
#cur{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-60%);transition:transform 0.15s ease;font-size:14px;color:var(--heart);filter:drop-shadow(0 0 6px rgba(196,167,255,0.7));will-change:left,top;}
#cur.hover{transform:translate(-50%,-60%) scale(1.6);filter:drop-shadow(0 0 12px rgba(196,167,255,1));}
.heart-burst{position:fixed;pointer-events:none;z-index:9998;font-size:10px;color:rgba(196,167,255,0.8);animation:burstFly 0.75s ease-out forwards;will-change:transform,opacity;}
@keyframes burstFly{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0.4);opacity:0;}}

/* ── CANVAS ── */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* ── INTRO CANVAS ── */
#intro-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:500;background:#04030c;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity 0.9s cubic-bezier(0.4,0,0.2,1);}
.screen.active{opacity:1;pointer-events:all;}

/* ── LANDING ── */
#s-land .brand{
  font-family:'Playfair Display',serif;
  font-size:clamp(5.5rem,15vw,12rem);
  font-weight:400;
  font-style:italic;
  letter-spacing:-0.03em;
  line-height:0.9;
  background:linear-gradient(135deg,#ede0ff 0%,#c4a7ff 35%,#9d8cff 65%,#82d9fa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 80px rgba(109,40,217,0.65));
  animation:brandPulse 5s ease-in-out infinite;
}
@keyframes brandPulse{
  0%,100%{filter:drop-shadow(0 0 80px rgba(109,40,217,0.65));}
  50%{filter:drop-shadow(0 0 140px rgba(109,40,217,1)) drop-shadow(0 0 250px rgba(67,56,202,0.4));}
}
#s-land .tagline{
  margin-top:1.6rem;
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(0.58rem,1.4vw,0.82rem);
  font-weight:300;
  letter-spacing:0.28em;
  color:var(--dim);
  text-transform:lowercase;
  animation:fadeUp 1.2s 0.6s both;
}
#s-land .start-btn{
  margin-top:4.5rem;
  background:none;border:none;
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;
  font-weight:300;
  letter-spacing:0.35em;
  color:rgba(255,255,255,0.22);
  text-transform:lowercase;
  cursor:none;
  transition:color 0.5s,letter-spacing 0.5s;
  animation:fadeUp 1.4s 1.4s both;
  position:relative;
}
#s-land .start-btn::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(196,167,255,0.7),transparent);transition:width 0.5s;}
#s-land .start-btn:hover{color:rgba(255,255,255,0.75);letter-spacing:0.55em;}
#s-land .start-btn:hover::after{width:100%;}
#s-land .guided-btn{
  margin-top:1.2rem;
  background:none;border:none;
  font-family:'JetBrains Mono',monospace;
  font-size:0.6rem;font-weight:300;
  letter-spacing:0.2em;
  color:rgba(255,255,255,0.14);
  text-transform:lowercase;cursor:none;
  transition:color 0.4s;
  animation:fadeUp 1.4s 1.8s both;
}
#s-land .guided-btn:hover{color:rgba(255,255,255,0.45);}

/* ── ORBS ── */
.orb-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;}
.orb{width:min(58vw,560px);height:min(58vw,560px);border-radius:50%;position:relative;animation:orbFloat 9s ease-in-out infinite;}
.orb-inner{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 33% 33%,rgba(196,167,255,0.3) 0%,rgba(99,102,241,0.2) 30%,rgba(14,165,233,0.1) 60%,transparent 76%);filter:blur(35px);animation:orbInner 7s ease-in-out infinite alternate;}
.orb-ring{position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(109,40,217,0.13);animation:ringRot 22s linear infinite;}
.orb-ring-2{position:absolute;inset:-55px;border-radius:50%;border:1px solid rgba(67,56,202,0.07);animation:ringRot 38s linear infinite reverse;}
.orb-ring-3{position:absolute;inset:-90px;border-radius:50%;border:1px dashed rgba(196,167,255,0.04);animation:ringRot 60s linear infinite;}
.orb-dot{position:absolute;width:5px;height:5px;background:rgba(196,167,255,0.85);border-radius:50%;top:-24px;left:50%;box-shadow:0 0 12px rgba(196,167,255,0.85);}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1);}33%{transform:translateY(-20px) scale(1.025);}66%{transform:translateY(12px) scale(0.978);}}
@keyframes orbInner{from{transform:scale(1) rotate(0deg);opacity:.75;}to{transform:scale(1.12) rotate(18deg);opacity:1;}}
@keyframes ringRot{to{transform:rotate(360deg);}}

/* ── INPUT ── */
#s-input .glass-box{
  width:min(92vw,600px);padding:3.2rem;
  background:rgba(255,255,255,0.025);
  backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,0.055);
  border-radius:26px;
  box-shadow:0 0 70px rgba(109,40,217,0.1),inset 0 1px 0 rgba(255,255,255,0.055);
  position:relative;animation:glassReveal 0.7s ease both;
}
@keyframes glassReveal{from{transform:translateY(22px) scale(0.97);opacity:0;}to{transform:none;opacity:1;}}
#s-input .glass-box::before{content:'';position:absolute;inset:-1px;border-radius:27px;background:linear-gradient(135deg,rgba(109,40,217,0.18),transparent,rgba(14,165,233,0.08));z-index:-1;opacity:0;transition:opacity 0.4s;}
#s-input .glass-box:focus-within::before{opacity:1;}
#s-input .input-label{font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:300;letter-spacing:0.3em;color:var(--dim);text-transform:lowercase;margin-bottom:1.6rem;display:block;}
#s-input textarea{width:100%;background:none;border:none;outline:none;font-family:'Playfair Display',serif;font-size:clamp(1.15rem,2.4vw,1.55rem);font-weight:300;font-style:italic;color:rgba(255,255,255,0.82);resize:none;min-height:100px;line-height:1.75;caret-color:rgba(196,167,255,0.9);}
#s-input textarea::placeholder{color:rgba(255,255,255,0.16);}
#s-input .char-hint{margin-top:1.4rem;font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:300;letter-spacing:0.15em;color:rgba(255,255,255,0.13);}
#s-input .submit-btn{margin-top:2.2rem;width:100%;padding:1.1rem;background:linear-gradient(135deg,rgba(109,40,217,0.28),rgba(67,56,202,0.18));border:1px solid rgba(109,40,217,0.28);border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:300;letter-spacing:0.25em;color:rgba(255,255,255,0.55);text-transform:lowercase;cursor:none;transition:all 0.35s;position:relative;overflow:hidden;}
#s-input .submit-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(109,40,217,0.48),rgba(67,56,202,0.38));opacity:0;transition:opacity 0.35s;}
#s-input .submit-btn:hover{color:rgba(255,255,255,0.92);border-color:rgba(109,40,217,0.55);}
#s-input .submit-btn:hover::before{opacity:1;}
#s-input .submit-btn span{position:relative;z-index:1;}

/* ── ACK OVERLAY ── */
#ack-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.5s;background:rgba(4,3,12,0.85);backdrop-filter:blur(6px);}
#ack-overlay.show{opacity:1;pointer-events:all;}
#ack-overlay p{font-family:'Playfair Display',serif;font-size:clamp(1.2rem,2.5vw,1.6rem);font-style:italic;font-weight:300;color:rgba(255,255,255,0.6);letter-spacing:0.04em;animation:ackPulse 1.4s ease-in-out forwards;}
@keyframes ackPulse{0%{opacity:0;transform:translateY(8px);}30%{opacity:1;transform:none;}80%{opacity:1;}100%{opacity:0;}}

/* ── PROCESSING ── */
#s-proc .proc-text{font-family:'Playfair Display',serif;font-size:clamp(1rem,2vw,1.3rem);font-weight:300;font-style:italic;color:var(--dim);letter-spacing:0.06em;animation:procPulse 2.2s ease-in-out infinite;}
@keyframes procPulse{0%,100%{opacity:0.35;}50%{opacity:.95;}}
.wave-rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.wave-ring{position:absolute;border:1px solid rgba(109,40,217,0.25);border-radius:50%;animation:waveExp 3.5s ease-out infinite;}
.wave-ring:nth-child(1){animation-delay:0s;}
.wave-ring:nth-child(2){animation-delay:0.9s;}
.wave-ring:nth-child(3){animation-delay:1.8s;}
@keyframes waveExp{0%{width:70px;height:70px;opacity:.8;}100%{width:650px;height:650px;opacity:0;}}
.waveform{display:flex;align-items:center;gap:3px;height:32px;}
.wave-bar{width:3px;border-radius:2px;background:linear-gradient(to top,rgba(109,40,217,0.6),rgba(196,167,255,0.3));animation:barDance 1.3s ease-in-out infinite;}
.wave-bar:nth-child(1){animation-delay:0s;}
.wave-bar:nth-child(2){animation-delay:.1s;}
.wave-bar:nth-child(3){animation-delay:.2s;}
.wave-bar:nth-child(4){animation-delay:.3s;}
.wave-bar:nth-child(5){animation-delay:.4s;}
.wave-bar:nth-child(6){animation-delay:.5s;}
.wave-bar:nth-child(7){animation-delay:.6s;}
.wave-bar:nth-child(8){animation-delay:.7s;}
@keyframes barDance{0%,100%{height:4px;}50%{height:26px;}}

/* ── RESULT ── */
#s-result{flex-direction:column;gap:0;overflow-y:auto;padding:2rem;-webkit-overflow-scrolling:touch;}
.result-card{width:min(92vw,520px);padding:2.6rem;background:rgba(255,255,255,0.025);backdrop-filter:blur(50px);border:1px solid rgba(255,255,255,0.055);border-radius:26px;box-shadow:0 0 100px rgba(109,40,217,0.13);animation:cardReveal 0.9s cubic-bezier(0.16,1,0.3,1) both;position:relative;overflow:hidden;}
@keyframes cardReveal{from{transform:translateY(35px) scale(0.94);opacity:0;}to{transform:none;opacity:1;}}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(109,40,217,0.55),transparent);}
.result-intro-line{font-family:'Playfair Display',serif;font-size:0.85rem;font-style:italic;font-weight:300;color:rgba(255,255,255,0.28);letter-spacing:0.04em;margin-bottom:1.6rem;animation:fadeUp 0.6s 0.1s both;}
.emotion-tag{font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:300;letter-spacing:0.3em;text-transform:lowercase;color:var(--dim);margin-bottom:1.9rem;}
.album-art{width:100%;aspect-ratio:1;border-radius:18px;position:relative;overflow:hidden;margin-bottom:1.9rem;box-shadow:0 24px 70px rgba(0,0,0,0.65);}
.album-art-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.album-gradient{position:absolute;inset:0;border-radius:18px;}
.album-symbol{font-size:4.5rem;position:relative;z-index:1;filter:drop-shadow(0 0 24px rgba(255,255,255,0.28));animation:symFloat 4.5s ease-in-out infinite;}
@keyframes symFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-9px) scale(1.06);}}
.album-shimmer{position:absolute;inset:0;background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,0.055) 50%,transparent 70%);animation:shimmer 3.5s ease-in-out infinite;}
@keyframes shimmer{0%,100%{transform:translateX(-100%);}50%{transform:translateX(100%);}}
.song-title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:400;line-height:1.15;color:rgba(255,255,255,0.92);margin-bottom:0.4rem;}
.song-artist{font-family:'JetBrains Mono',monospace;font-size:0.67rem;font-weight:300;letter-spacing:0.15em;color:var(--dim);text-transform:lowercase;margin-bottom:1.6rem;}
.ai-line{font-family:'Playfair Display',serif;font-size:clamp(0.9rem,1.7vw,1.05rem);font-style:italic;font-weight:300;color:rgba(255,255,255,0.45);line-height:1.75;padding:1.2rem 1.3rem;border-left:1px solid rgba(109,40,217,0.35);background:rgba(109,40,217,0.04);border-radius:0 10px 10px 0;margin-bottom:2.2rem;}
.result-actions{display:flex;flex-direction:column;gap:.85rem;}
.btn-listen{padding:1.05rem 1.5rem;background:linear-gradient(135deg,rgba(109,40,217,0.45),rgba(67,56,202,0.35));border:1px solid rgba(109,40,217,0.38);border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:300;letter-spacing:0.2em;color:rgba(255,255,255,0.78);text-transform:lowercase;cursor:none;transition:all 0.3s;text-align:center;text-decoration:none;display:block;}
.btn-listen:hover{background:linear-gradient(135deg,rgba(109,40,217,0.68),rgba(67,56,202,0.58));color:white;}
.btn-row{display:flex;gap:.85rem;}
.btn-secondary{flex:1;padding:.9rem;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.07);border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:0.63rem;font-weight:300;letter-spacing:0.14em;color:var(--dim);text-transform:lowercase;cursor:none;transition:all 0.3s;text-align:center;}
.btn-secondary:hover{border-color:rgba(255,255,255,0.18);color:rgba(255,255,255,0.58);}

/* ── PLAYER ── */
#yt-player-wrap{width:100%;margin-top:1.2rem;border-radius:12px;overflow:hidden;opacity:0;animation:fadeUp 0.6s 0.4s both;animation-fill-mode:forwards;}
#yt-player-wrap iframe{width:100%;height:90px;border:none;border-radius:12px;}

/* ── HISTORY ── */
#s-history{flex-direction:column;overflow-y:auto;padding:3rem 2rem;align-items:center;gap:1rem;}
#s-history .hist-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;font-style:italic;background:linear-gradient(135deg,#ede0ff,#c4a7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1rem;}
#s-history .hist-sub{font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:300;letter-spacing:0.25em;color:var(--dim);text-transform:lowercase;margin-bottom:2.2rem;}
.hist-list{width:min(92vw,520px);display:flex;flex-direction:column;gap:.85rem;}
.hist-item{padding:1.25rem 1.5rem;background:rgba(255,255,255,0.018);border:1px solid rgba(255,255,255,0.045);border-radius:16px;display:flex;align-items:center;gap:1rem;cursor:none;transition:all 0.3s;animation:fadeUp 0.5s ease both;}
.hist-item:hover{background:rgba(109,40,217,0.07);border-color:rgba(109,40,217,0.2);}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.hist-content{flex:1;min-width:0;}
.hist-mood{font-family:'Playfair Display',serif;font-size:.95rem;font-style:italic;color:rgba(255,255,255,0.58);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-song{font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:300;letter-spacing:0.1em;color:var(--dim);text-transform:lowercase;margin-top:.2rem;}
.hist-time{font-family:'JetBrains Mono',monospace;font-size:0.53rem;color:rgba(255,255,255,0.13);flex-shrink:0;}
.hist-empty{font-family:'Playfair Display',serif;font-size:1rem;font-style:italic;color:rgba(255,255,255,0.18);text-align:center;padding:3rem;}

/* ── GUIDED ── */
#s-guided{flex-direction:column;gap:2rem;}
.guided-q{font-family:'Playfair Display',serif;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:300;font-style:italic;color:rgba(255,255,255,0.75);text-align:center;animation:fadeUp 0.5s ease both;}
.guided-options{display:flex;flex-direction:column;gap:.75rem;width:min(90vw,400px);}
.guided-opt{padding:1rem 1.5rem;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:14px;font-family:'Playfair Display',serif;font-size:0.95rem;font-style:italic;color:rgba(255,255,255,0.5);cursor:none;transition:all 0.3s;text-align:left;}
.guided-opt:hover{background:rgba(109,40,217,0.1);border-color:rgba(109,40,217,0.3);color:rgba(255,255,255,0.85);}
.guided-step{font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:300;letter-spacing:0.2em;color:rgba(255,255,255,0.15);text-transform:lowercase;}

/* ── NAV ── */
#nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.5rem 2.5rem;opacity:0;pointer-events:none;transition:opacity 0.7s;}
#nav.visible{opacity:1;pointer-events:all;}
.nav-brand{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:300;font-style:italic;background:linear-gradient(135deg,#ede0ff,#c4a7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-links{display:flex;gap:2rem;align-items:center;}
.nav-link{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:0.63rem;font-weight:300;letter-spacing:0.2em;color:var(--dim);text-transform:lowercase;cursor:none;transition:color 0.3s;}
.nav-link:hover,.nav-link.active{color:rgba(255,255,255,0.68);}

/* ── TOAST ── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(109,40,217,0.18);backdrop-filter:blur(20px);border:1px solid rgba(109,40,217,0.28);border-radius:100px;padding:.7rem 1.6rem;font-family:'JetBrains Mono',monospace;font-size:0.63rem;font-weight:300;letter-spacing:0.15em;color:rgba(255,255,255,0.68);text-transform:lowercase;z-index:200;opacity:0;transition:all 0.4s;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── SCANLINES + NOISE ── */
body::after{content:'';position:fixed;inset:0;z-index:9990;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);}
body::before{content:'';position:fixed;inset:0;z-index:9989;pointer-events:none;opacity:0.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ── FLOATERS ── */
.floater{position:fixed;font-family:'Playfair Display',serif;font-style:italic;color:rgba(255,255,255,0.035);font-size:1rem;pointer-events:none;z-index:2;animation:floatDrift linear infinite;}
@keyframes floatDrift{0%{transform:translateY(100vh) rotate(-4deg);opacity:0;}8%{opacity:1;}92%{opacity:1;}100%{transform:translateY(-20vh) rotate(4deg);opacity:0;}}

/* ── TIME AWARE ── */
.late-night-banner{position:fixed;top:5rem;left:50%;transform:translateX(-50%);font-family:'Playfair Display',serif;font-size:0.85rem;font-style:italic;color:rgba(255,255,255,0.25);z-index:50;opacity:0;animation:lnFade 4s 1s forwards;}
@keyframes lnFade{0%{opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}

/* ── UTILS ── */
@keyframes fadeUp{from{transform:translateY(16px);opacity:0;}to{transform:none;opacity:1;}}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(109,40,217,0.28);border-radius:2px;}

/* MOBILE */
@media(max-width:600px){
  #nav{padding:1.2rem 1.5rem;}
  .nav-links{gap:1.2rem;}
  #s-input .glass-box{padding:2.2rem 1.8rem;}
  .result-card{padding:1.8rem;}
  .guided-options{width:min(90vw,360px);}
  body{cursor:auto;}
  #cur{display:none;}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}
}
</style>
</head>
<body>

<canvas id="intro-canvas"></canvas>
<div id="cur">♡</div>

// ═══════════════════════════════════════════════════════
// CANVAS — PARTICLE FIELD
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
let bgHue1 = 265, bgHue2 = 235, bgHueTarget1 = 265, bgHueTarget2 = 235;
let particleJitter = 0;
let tabActive = true;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

class Particle {
  constructor(initY = false) {
    this.reset();
    if (initY) this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 10;
    this.size = Math.random() * 1.8 + 0.3;
    this.speedY = Math.random() * 0.38 + 0.09;
    this.speedX = (Math.random() - 0.5) * 0.25;
    this.opacity = Math.random() * 0.45 + 0.08;
    this.hue = Math.random() > 0.5 ? 258 + Math.random() * 35 : 195 + Math.random() * 28;
  }
  update() {
    this.y -= this.speedY;
    this.x += this.speedX + (Math.random() - 0.5) * particleJitter;
    if (this.y < -5) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue},75%,74%,${this.opacity})`;
    ctx.fill();
  }
}

function initParticles() {
  const count = isMobile ? PARTICLE_COUNT_MOBILE : PARTICLE_COUNT_DESKTOP;
  particles = Array.from({length: count}, () => new Particle(true));
}

let animFrameId;
function animCanvas() {
  if (!tabActive) { animFrameId = requestAnimationFrame(animCanvas); return; }
  bgHue1 += (bgHueTarget1 - bgHue1) * 0.01;
  bgHue2 += (bgHueTarget2 - bgHue2) * 0.01;

  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createRadialGradient(W*0.5, H*0.42, 0, W*0.5, H*0.42, W*0.72);
  grad.addColorStop(0, `hsla(${bgHue1},58%,7%,0.65)`);
  grad.addColorStop(0.5, `hsla(${bgHue2},48%,4%,0.45)`);
  grad.addColorStop(1, 'hsla(240,28%,2%,0.92)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(109,40,217,0.025)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 90) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 90) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  particles.forEach(p => { p.update(); p.draw(); });
  animFrameId = requestAnimationFrame(animCanvas);
}

document.addEventListener('visibilitychange', () => { tabActive = !document.hidden; });
resize(); initParticles(); animCanvas();
window.addEventListener('resize', () => { resize(); initParticles(); });

  }
}

// ═══════════════════════════════════════════════════════
// SCREEN TRANSITIONS
// ═══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreen = id;
  const nav = document.getElementById('nav');
  nav.classList.toggle('visible', id !== 's-land');
}

// ═══════════════════════════════════════════════════════
// EMOTION + SONG ENGINE
// ═══════════════════════════════════════════════════════
function detectEmotion(text) {
  const lower = text.toLowerCase();
  let scores = {};
  Object.entries(EMOTION_MAP).forEach(([emo, kws]) => {
    scores[emo] = kws.reduce((acc, k) => acc + (lower.includes(k) ? 1 : 0), 0);
  });
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  if (sorted[0][1] === 0) {
    const keys = Object.keys(SONGS);
    return keys[Math.floor(Math.random() * keys.length)];
  }
  return sorted[0][0];
}

function getBestSong(emotion) {
  const pool = (SONGS[emotion] || SONGS.late_night).filter(s => !lastSongs.includes(s.title));
  const src = pool.length ? pool : (SONGS[emotion] || SONGS.late_night);
  const pick = src[Math.floor(Math.random() * src.length)];
  lastSongs.push(pick.title);
  if (lastSongs.length > LAST_SONGS_TRACK) lastSongs.shift();
  return pick;
}

// ═══════════════════════════════════════════════════════
// RESULT DISPLAY
// ═══════════════════════════════════════════════════════
function showResult(emotion, song, inputText) {
  const card = document.getElementById('result-card');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = '';

  const introLine = INTRO_LINES[Math.floor(Math.random() * INTRO_LINES.length)];
  document.getElementById('result-intro').textContent = introLine;
  document.getElementById('result-emotion').textContent = `✦ ${EMOTION_LABELS[emotion] || emotion}`;
  document.getElementById('result-song').textContent = song.title;
  document.getElementById('result-artist').textContent = song.artist;
  document.getElementById('result-line').textContent = `"${song.line}"`;
  document.getElementById('album-symbol').textContent = song.symbol;
  document.getElementById('album-gradient').style.background =
    `radial-gradient(ellipse at 38% 38%, ${song.colors[0]}, ${song.colors[1]}, ${song.colors[2]})`;

  const q = encodeURIComponent(song.query || song.title + ' ' + song.artist);
  document.getElementById('btn-listen').href = `https://www.youtube.com/results?search_query=${q}`;

  // Lazy inject YouTube search player
  const pw = document.getElementById('yt-player-wrap');
  pw.innerHTML = '';
  pw.style.opacity = '0';
  setTimeout(() => {
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed?listType=search&list=${q}&autoplay=0`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    pw.appendChild(iframe);
    pw.style.opacity = '1';
  }, 1200);

  updateTheme(emotion);
  currentWhispers = WHISPERS[emotion] || WHISPERS.default;
  currentResult = {emotion, song, inputText, time: Date.now()};
  showScreen('s-result');
}

// ═══════════════════════════════════════════════════════
// PROCESS FLOW — WITH ACK PAUSE
// ═══════════════════════════════════════════════════════
function process(text) {
  const ta = document.getElementById('mood-input');
  ta.style.opacity = '0';
  ta.style.transition = 'opacity 0.4s';

  const ack = document.getElementById('ack-overlay');
  ack.classList.add('show');

  setTimeout(() => {
    ack.classList.remove('show');
    ta.style.opacity = '';
    showScreen('s-proc');
    setTimeout(() => {
      const emotion = detectEmotion(text);
      const song = getBestSong(emotion);
      showResult(emotion, song, text);
    }, 2800);
  }, 1500);
}

// ═══════════════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════════════
function saveFrequency() {
  if (!currentResult) return;
  const entry = {
    id: Date.now(),
    input: currentResult.inputText,
    emotion: currentResult.emotion,
    song: currentResult.song.title,
    artist: currentResult.song.artist,
    time: currentResult.time,
    color: HIST_COLORS[Math.floor(Math.random() * HIST_COLORS.length)],
  };
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  safeSaveHistory(history);
  showToast('kept this version of you ✦');
}

function renderHistory() {
  const list = document.getElementById('hist-list');
  if (history.length === 0) {
    list.innerHTML = '<div class="hist-empty">no frequencies yet…<br>go feel something</div>';
    return;
  }
  list.innerHTML = history.map((e,i) => {
    const d = new Date(e.time);
    const label = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const safeInput = e.input.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="hist-item" style="animation-delay:${i*0.07}s">
      <div class="hist-dot" style="background:${e.color};box-shadow:0 0 8px ${e.color}40"></div>
      <div class="hist-content">
        <div class="hist-mood">${safeInput}</div>
        <div class="hist-song">♪ ${e.song} — ${e.artist}</div>
      </div>
      <div class="hist-time">${label}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════════════════════
// GUIDED MODE
// ═══════════════════════════════════════════════════════
function startGuided() {
  guidedAnswers = [];
  guidedStep = 0;
  showGuidedStep();
  showScreen('s-guided');
}

function showGuidedStep() {
  const q = GUIDED[guidedStep % GUIDED.length];
  const stepEl = document.getElementById('guided-step-label');
  const qEl = document.getElementById('guided-q');
  const optEl = document.getElementById('guided-options');

  stepEl.textContent = `question ${guidedStep+1} of ${GUIDED.length}`;
  qEl.style.opacity = '0';
  optEl.style.opacity = '0';

  setTimeout(() => {
    qEl.textContent = q.q;
    qEl.style.transition = 'opacity 0.5s';
    qEl.style.opacity = '1';
    optEl.innerHTML = q.options.map(o =>
      `<button class="guided-opt" data-map="${o.map}">${o.label}</button>`
    ).join('');
    optEl.style.transition = 'opacity 0.5s';
    optEl.style.opacity = '1';
    optEl.querySelectorAll('.guided-opt').forEach(btn => {
      btn.addEventListener('click', () => handleGuidedAnswer(btn.dataset.map));
    });
  }, 200);
}

function handleGuidedAnswer(map) {
  guidedAnswers.push(map);
  guidedStep++;
  if (guidedStep >= GUIDED.length) {
    const counts = {};
    guidedAnswers.forEach(a => { counts[a] = (counts[a]||0)+1; });
    const emotion = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
    const song = getBestSong(emotion);
    showScreen('s-proc');
    setTimeout(() => showResult(emotion, song, 'guided mode'), 2800);
  } else {
    showGuidedStep();
  }
}

// ═══════════════════════════════════════════════════════
// CINEMATIC INTRO — ALL 26 LETTERS
// ═══════════════════════════════════════════════════════
(function runIntro() {
  const introCanvas = document.getElementById('intro-canvas');
  if (!introCanvas) return;

  // Check session — skip if already seen
  let skipIntro = false;
  try { skipIntro = sessionStorage.getItem(SESSION_KEY) === '1'; } catch {}

  if (skipIntro) {
    introCanvas.style.display = 'none';
    showScreen('s-land');
    checkLateNight();
    return;
  }

  const ic = introCanvas.getContext('2d');
  let iW = introCanvas.width = window.innerWidth;
  let iH = introCanvas.height = window.innerHeight;

  const ALL_LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const TARGET = ['f','r','e','q','.'];

  // Phase timing (ms)
  const T_VOID = 800;
  const T_SCATTER = T_VOID + 2200;
  const T_PULL = T_SCATTER + 600;
  const T_FORM = T_PULL + 2400;
  const T_PULSE = T_FORM + 600;
  const T_TAGLINE = T_PULSE + 800;
  const T_START_BTN = T_TAGLINE + 1200;
  const T_DONE = T_START_BTN + 900;

  let startTime = null;
  let phase = 0; // 0=void, 1=scatter, 2=pull, 3=form, 4=pulse, 5=tagline, 6=startbtn, 7=done
  let introRunning = true;

  // Create letter particles — all 26
  const NUM_SCATTER = 52; // 2 of each letter approx
  const cx2 = iW / 2;
  const cy2 = iH / 2;

  // Font for layout calc
  const FONT_SIZE = Math.min(iW * 0.14, 130);
  const MONO_FONT = `${FONT_SIZE}px 'Playfair Display', serif`;

  // Compute target positions for f r e q .
  // We'll lay them out centered
  const charSpacing = FONT_SIZE * 0.72;
  const totalW = TARGET.length * charSpacing;
  const startX = cx2 - totalW / 2 + charSpacing * 0.28;

  const targetPositions = TARGET.map((ch, i) => ({
    x: startX + i * charSpacing,
    y: cy2,
  }));

  // Assign each scatter particle to a target or to "fade away"
  const letters = [];
  for (let i = 0; i < NUM_SCATTER; i++) {
    const ch = ALL_LETTERS[i % ALL_LETTERS.length];
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.2 * Math.min(iW, iH) + Math.random() * 0.35 * Math.min(iW, iH);
    const x = cx2 + Math.cos(angle) * radius;
    const y = cy2 + Math.sin(angle) * radius;
    const isTarget = i < TARGET.length;
    const targetIdx = isTarget ? i : -1;
    letters.push({
      ch,
      x, y,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.015,
      opacity: 0,
      size: FONT_SIZE * (0.35 + Math.random() * 0.45),
      targetIdx,
      isTarget,
      fadeOut: false,
    });
  }

  // Override first 5 to be our actual target letters
  TARGET.forEach((ch, i) => {
    letters[i].ch = ch;
  });

  let pulseAmt = 0;
  let taglineOpacity = 0;
  let startBtnOpacity = 0;

  function ease(t, exp = 3) { return 1 - Math.pow(1 - t, exp); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawIntro(ts) {
    if (!introRunning) return;
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;

    ic.clearRect(0, 0, iW, iH);
    ic.fillStyle = '#04030c';
    ic.fillRect(0, 0, iW, iH);

    // VOID phase — just dark
    if (elapsed < T_VOID) {
      // subtle grain
      const grainOpacity = Math.min(elapsed / T_VOID, 1) * 0.015;
      // just keep dark
    }

    // SCATTER phase — letters appear and drift
    if (elapsed >= T_VOID && elapsed < T_PULL) {
      const t = (elapsed - T_VOID) / (T_SCATTER - T_VOID);
      letters.forEach((l, idx) => {
        const delay = (idx / letters.length) * 0.5;
        const lt = Math.max(0, Math.min(1, (t - delay) / 0.3));
        l.opacity = lt * (0.25 + Math.random() * 0.0);
        if (lt > 0) {
          l.x += l.vx;
          l.y += l.vy;
          l.rot += l.rotSpeed;
        }
      });
    }

    // PULL phase — letters start noticing center
    if (elapsed >= T_PULL && elapsed < T_FORM) {
      const t = ease((elapsed - T_PULL) / (T_FORM - T_PULL), 2);
      letters.forEach((l, idx) => {
        if (l.isTarget) {
          const tp = targetPositions[l.targetIdx];
          l.x = lerp(l.x, tp.x, t * 0.06);
          l.y = lerp(l.y, tp.y, t * 0.06);
          l.rot *= (1 - t * 0.05);
          l.opacity = Math.min(l.opacity + 0.01, 0.55 + t * 0.35);
        } else {
          // non-target letters drift slightly toward center then fade
          l.x = lerp(l.x, cx2, t * 0.04);
          l.y = lerp(l.y, cy2, t * 0.04);
          l.opacity = Math.max(0, l.opacity - t * 0.025);
        }
      });
    }

    // FORM phase — snap into word
    if (elapsed >= T_FORM && elapsed < T_PULSE) {
      const t = ease((elapsed - T_FORM) / (T_PULSE - T_FORM), 4);
      letters.forEach((l) => {
        if (l.isTarget) {
          const tp = targetPositions[l.targetIdx];
          l.x = lerp(l.x, tp.x, t * 0.18);
          l.y = lerp(l.y, tp.y, t * 0.18);
          l.rot = lerp(l.rot, 0, t * 0.25);
          l.opacity = lerp(l.opacity, 1, t * 0.12);
          l.size = lerp(l.size, FONT_SIZE, t * 0.1);
        } else {
          l.opacity = Math.max(0, l.opacity - 0.035);
        }
      });

      // Particle shimmer trail
      if (Math.random() < 0.35) {
        spawnIntroParticle(cx2, cy2, 0.5 + t * 0.4);
      }
    }

    // PULSE phase
    if (elapsed >= T_PULSE && elapsed < T_TAGLINE) {
      const t = (elapsed - T_PULSE) / (T_TAGLINE - T_PULSE);
      pulseAmt = Math.sin(t * Math.PI) * 0.35;
      letters.forEach(l => { if (l.isTarget) l.opacity = 1; });
    }

    // TAGLINE
    if (elapsed >= T_TAGLINE) {
      const t = Math.min((elapsed - T_TAGLINE) / 800, 1);
      taglineOpacity = ease(t, 2);
    }

    // START BTN
    if (elapsed >= T_START_BTN) {
      const t = Math.min((elapsed - T_START_BTN) / 700, 1);
      startBtnOpacity = ease(t, 2);
    }

    // Draw shimmer particles
    introParticles.forEach((p, i) => {
      p.life -= 0.022;
      p.x += p.vx;
      p.y += p.vy;
      if (p.life > 0) {
        ic.beginPath();
        ic.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ic.fillStyle = `rgba(196,167,255,${p.life * p.opacity})`;
        ic.fill();
      }
    });

    // Draw letters
    letters.forEach(l => {
      if (l.opacity <= 0.01) return;
      ic.save();
      ic.translate(l.x, l.y);
      ic.rotate(l.rot);
      ic.globalAlpha = l.opacity;
      ic.font = `300 italic ${l.size}px 'Playfair Display', serif`;
      ic.textAlign = 'center';
      ic.textBaseline = 'middle';

      if (l.isTarget && elapsed >= T_PULSE) {
        // Glow
        ic.shadowColor = 'rgba(196,167,255,0.9)';
        ic.shadowBlur = 30 + pulseAmt * 60;
        // Gradient text simulation
        const grad = ic.createLinearGradient(-l.size/2, -l.size/2, l.size/2, l.size/2);
        grad.addColorStop(0, '#ede0ff');
        grad.addColorStop(0.4, '#c4a7ff');
        grad.addColorStop(0.7, '#9d8cff');
        grad.addColorStop(1, '#82d9fa');
        ic.fillStyle = grad;
      } else if (l.isTarget) {
        ic.shadowColor = 'rgba(196,167,255,0.6)';
        ic.shadowBlur = 20;
        ic.fillStyle = 'rgba(220,200,255,0.9)';
      } else {
        ic.fillStyle = 'rgba(255,255,255,0.6)';
        ic.shadowBlur = 0;
      }
      ic.fillText(l.ch, 0, 0);
      ic.restore();
    });

    // Draw tagline
    if (taglineOpacity > 0.01) {
      ic.save();
      ic.globalAlpha = taglineOpacity;
      ic.font = `300 ${Math.max(11, iW * 0.013)}px 'JetBrains Mono', monospace`;
      ic.textAlign = 'center';
      ic.textBaseline = 'middle';
      ic.fillStyle = 'rgba(255,255,255,0.32)';
      ic.letterSpacing = '0.28em';
      ic.fillText('tune into how you feel', cx2, cy2 + FONT_SIZE * 0.78);
      ic.restore();
    }

    // Draw start button text
    if (startBtnOpacity > 0.01) {
      ic.save();
      ic.globalAlpha = startBtnOpacity;
      ic.font = `300 ${Math.max(10, iW * 0.012)}px 'JetBrains Mono', monospace`;
      ic.textAlign = 'center';
      ic.textBaseline = 'middle';
      ic.fillStyle = 'rgba(255,255,255,0.18)';
      ic.fillText('— start —', cx2, cy2 + FONT_SIZE * 1.2);
      ic.restore();
    }

    if (elapsed < T_DONE) {
      requestAnimationFrame(drawIntro);
    } else {
      // Fade out intro canvas
      let fadeAlpha = 1;
      function fadeOut() {
        fadeAlpha -= 0.04;
        if (fadeAlpha <= 0) {
          introCanvas.style.display = 'none';
          introRunning = false;
          showScreen('s-land');
          checkLateNight();
          try { sessionStorage.setItem(SESSION_KEY, '1'); } catch {}
          return;
        }
        ic.clearRect(0, 0, iW, iH);
        ic.fillStyle = `rgba(4,3,12,${1-fadeAlpha})`;
        ic.fillRect(0, 0, iW, iH);
        // redraw letters fading
        letters.forEach(l => {
          if (!l.isTarget || l.opacity <= 0.01) return;
          ic.save();
          ic.globalAlpha = l.opacity * fadeAlpha;
          ic.translate(l.x, l.y);
          ic.font = `300 italic ${l.size}px 'Playfair Display', serif`;
          ic.textAlign = 'center'; ic.textBaseline = 'middle';
          ic.shadowColor = 'rgba(196,167,255,0.8)';
          ic.shadowBlur = 30;
          const g = ic.createLinearGradient(-l.size/2,-l.size/2,l.size/2,l.size/2);
          g.addColorStop(0,'#ede0ff'); g.addColorStop(0.5,'#c4a7ff'); g.addColorStop(1,'#82d9fa');
          ic.fillStyle = g;
          ic.fillText(l.ch, 0, 0);
          ic.restore();
        });
        requestAnimationFrame(fadeOut);
      }
      requestAnimationFrame(fadeOut);
    }
  }

  // Shimmer particles for intro
  const introParticles = [];
  function spawnIntroParticle(x, y, intensity) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 1.5 + 0.5) * intensity;
    introParticles.push({
      x: x + (Math.random()-0.5) * 200,
      y: y + (Math.random()-0.5) * 80,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.5,
      size: Math.random() * 2.5 + 0.5,
      opacity: Math.random() * 0.7 + 0.3,
      life: 1,
    });
  }

  requestAnimationFrame(drawIntro);
})();
</script>
